<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>Biologiya video yechim</title>
<style>
:root{--ink:#17302b;--acc:#e8643a;--green:#2f8f5b;--blue:#3a7bd5;--yel:#f6d65c;--bg:#fbf6e9;--grey:#b9b6aa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:var(--bg)}
body{font-family:'Inter','Liberation Sans',sans-serif;color:var(--ink);position:relative;
 background-image:linear-gradient(#e8e2cf 1px,transparent 1px),linear-gradient(90deg,#e8e2cf 1px,transparent 1px);
 background-size:36px 36px;background-color:var(--bg)}
body:before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:#f0b8a8}
.scene{position:absolute;inset:0;opacity:0}
.tag{position:absolute;top:34px;left:60px;font-weight:800;font-size:19px;color:var(--acc);border:2.5px solid var(--acc);
 padding:5px 12px;border-radius:7px;transform:rotate(-3deg);letter-spacing:1px}
.logo{position:absolute;top:30px;right:50px;font-weight:800;font-size:26px;display:flex;align-items:center;gap:12px}
.logo i{width:46px;height:46px;border-radius:50%;background:#17302b;display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;left:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--green);box-shadow:5px 4px 0 -2px #f6d65c}
.logo small{display:block;font-size:12px;letter-spacing:3px;color:var(--acc);font-weight:700}
.chip{display:inline-block;background:var(--yel);font-weight:800;font-size:25px;letter-spacing:1px;padding:7px 20px;border-radius:6px;
 transform:rotate(-2deg);box-shadow:3px 3px 0 #0001}
.head{position:absolute;top:150px;left:0;right:0;text-align:center}
.title{font-family:'CMU Serif','DejaVu Serif',serif;font-style:italic;font-size:52px;margin-top:26px;font-weight:500}
.body{position:absolute;left:70px;right:56px;top:350px;font-size:34px;line-height:1.5}
.body p{margin-bottom:26px}
.hl{background:linear-gradient(transparent 55%,#f6d65c 55%);font-weight:700}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:800}
.eq{font-size:56px;color:var(--ink)}
.dots{position:absolute;bottom:56px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.dots b{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);display:block}
.dots b.on{background:var(--acc);border-color:var(--acc);width:36px;border-radius:8px}
.dots b.done{background:var(--ink)}
.lbl{position:absolute;font-size:25px;font-weight:600;text-align:center;line-height:1.25}
.pill{position:absolute;border-radius:40px;font-weight:800;font-size:34px;padding:10px 26px;color:#fff;text-align:center}
.card{position:absolute;left:70px;right:56px;background:#fff;border:2.5px solid var(--ink);border-left:12px solid var(--ink);
 border-radius:6px;padding:14px 22px;font-size:31px;font-weight:700;box-shadow:4px 4px 0 #0001}
.card small{display:block;font-size:20px;font-weight:600;color:#6a766f;margin-bottom:3px}
svg{position:absolute;left:0;top:0}
.mono{font-family:'CMU Serif','DejaVu Serif',serif}
</style></head><body>
<div id="root"></div>
<script src="plan.js"></script>
<script>
const TL=window.PLAN.TL;
const MAPS=window.PLAN.A;
window.TOTAL=window.PLAN.TOTAL;
const NS='http://www.w3.org/2000/svg';
const root=document.getElementById('root');
function scene(id,html,step){const d=document.createElement('div');d.className='scene';d.id=id;
 let dots='';if(step!=null){dots='<div class="dots">'+[0,1,2,3,4,5].map(i=>'<b class="'+(i<step?'done':i==step?'on':'')+'"></b>').join('')+'</div>'}
 d.innerHTML=html+dots;root.appendChild(d);return d}
const topbar=(chipText,title)=>`<div class="tag">VIDEO YECHIM</div><div class="logo"><i></i><div>BIOLOGIYA<small>MASALA · YECHIM</small></div></div>
 <div class="head"><span class="chip">${chipText}</span><div class="title">${title}</div></div>`;
const E=(a,inner,style='',cls='',extra='')=>`<div class="el ${cls}" data-a="${a}" style="${style}" ${extra}>${inner}</div>`;

// S0 intro
scene('s0',`
 ${E(0.2,'<div class="logo" style="position:static;justify-content:center;font-size:44px"><i style="width:72px;height:72px"></i><div>BIOLOGIYA<small style="font-size:17px">MASALA · YECHIM</small></div></div>','position:absolute;left:0;right:0;top:360px')}
 ${E(0.8,'<span class="chip" style="font-size:36px">VIDEO YECHIM</span>','position:absolute;left:0;right:0;top:560px;text-align:center')}
 ${E(1.4,'<div class="title" style="font-size:66px;line-height:1.2">Makkajo‘xorida<br>meyoz va changlanish</div>','position:absolute;left:0;right:0;top:680px;text-align:center')}
`);
// S1 masala
scene('s1',topbar('MASALA','Shartni o‘qiymiz')+`
 <div class="body" style="top:360px;font-size:39px;line-height:1.55">
  ${E(0.4,'<p>Makkajo‘xorida <span class="hl">(2n = 20)</span> <span class="hl">240 ta</span> mikrosporotsit meyoz bilan bo‘lindi.</p>')}
  ${E(3.2,'<p>Hosil bo‘lgan mikrosporalarning <span class="hl">25 %</span> i changga aylanmadi.</p>')}
  ${E(5.6,'<p>Qolgan changlarning <span class="hl">1/3</span> qismi urug‘lanishda qatnashdi.</p>')}
  ${E(8.2,'<p style="font-weight:800;color:#e8643a">Urug‘lanishda qatnashgan spermiylardagi jami xromosomalar sonini toping.</p>')}
 </div>`);
// S2 1-qadam: meyoz 1 -> 4
scene('s2',topbar('1-QADAM','Meyoz: 1 → 4')+`
 <svg width="720" height="1280" viewBox="0 0 720 1280">
  <g class="el" data-a="0.6"><circle cx="360" cy="470" r="86" fill="#cfe9d9" stroke="#17302b" stroke-width="5"/>
   <circle cx="360" cy="470" r="30" fill="#2f8f5b"/><text x="360" y="620" text-anchor="middle" font-size="27" font-weight="700" fill="#17302b">1 ta mikrosporotsit (2n = 20)</text></g>
  <g class="el" data-a="3"><text x="360" y="690" text-anchor="middle" font-size="26" font-weight="700" fill="#e8643a">meyoz ↓</text></g>
  ${[[225,790],[345,790],[465,790],[585,790]].map((p,i)=>`<g class="el" data-a="${3.6+i*0.35}"><circle cx="${p[0]-45}" cy="${p[1]}" r="46" fill="#f4e3a1" stroke="#17302b" stroke-width="4"/><circle cx="${p[0]-45}" cy="${p[1]}" r="15" fill="#e8643a"/></g>`).join('')}
  <g class="el" data-a="5.4"><text x="360" y="900" text-anchor="middle" font-size="27" font-weight="700" fill="#17302b">4 ta mikrospora (n = 10)</text></g>
 </svg>
 ${E(7.2,'<span class="mono" style="font-style:normal">240 · 4 = </span><span class="cnt" data-from="240" data-to="960" data-t0="7.6" data-t1="9.4">240</span>','position:absolute;left:0;right:0;top:1000px;text-align:center;font-size:66px;font-weight:800')}
 ${E(9.8,'<span style="font-size:27px;font-weight:600;color:#53605a">ta mikrospora hosil bo‘ldi</span>','position:absolute;left:0;right:0;top:1090px;text-align:center')}
`,0);
// S3 2-qadam: 25% chang bo'lmadi
scene('s3',topbar('2-QADAM','Changga aylanganlari')+`
 <svg width="720" height="1280" viewBox="0 0 720 1280">
  <g class="el" data-a="0.4"><rect x="80" y="470" width="560" height="90" rx="14" fill="#fff" stroke="#17302b" stroke-width="5"/>
   <text x="360" y="455" text-anchor="middle" font-size="28" font-weight="700">960 ta mikrospora</text></g>
  <g class="el grow" data-a="1.6" data-d="1.2"><rect x="80" y="470" width="420" height="90" rx="14" fill="#2f8f5b"/><text x="290" y="528" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">75 %</text></g>
  <g class="el" data-a="2.9"><rect x="500" y="470" width="140" height="90" rx="14" fill="#b9b6aa"/><text x="570" y="528" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">25 %</text></g>
  <g class="el" data-a="2.9"><text x="570" y="610" text-anchor="middle" font-size="23" font-weight="600" fill="#6a766f">changga</text><text x="570" y="638" text-anchor="middle" font-size="23" font-weight="600" fill="#6a766f">aylanmadi</text></g>
  <g class="el" data-a="2.2"><text x="290" y="610" text-anchor="middle" font-size="23" font-weight="600" fill="#2f8f5b">chang bo‘ldi</text></g>
 </svg>
 ${E(4.4,'<span style="font-size:30px;font-weight:600">100 % − 25 % = 75 %</span>','position:absolute;left:0;right:0;top:720px;text-align:center')}
 ${E(5.4,'<span class="mono" style="font-style:normal">960 · 0,75 = </span><span class="cnt" data-from="960" data-to="720" data-t0="5.8" data-t1="7">960</span>','position:absolute;left:0;right:0;top:860px;text-align:center;font-size:62px;font-weight:800')}
 ${E(7.2,'<span style="font-size:27px;font-weight:600;color:#53605a">ta chang</span>','position:absolute;left:0;right:0;top:955px;text-align:center')}
`,1);
// S4 3-qadam: 1/3
(function(){let g='';const cols=24,rows=30;
 for(let i=0;i<720;i++){const c=i%cols,r=Math.floor(i/cols);const x=88+c*20.8,y=372+r*14.6;
  const sel=i<240;g+=`<rect class="${sel?'sel':'nsel'}" data-i="${i}" x="${x}" y="${y}" width="15" height="9" rx="3" fill="#2f8f5b"/>`}
 scene('s4',topbar('3-QADAM','Urug‘lanishda qatnashgan')+`
 <svg width="720" height="1280" viewBox="0 0 720 1280">
  <text class="el" data-a="0.3" x="360" y="350" text-anchor="middle" font-size="27" font-weight="700">720 ta chang</text>
  <g class="el" data-a="0.6">${g}</g>
 </svg>
 ${E(3.4,'<span style="font-size:30px;font-weight:600">Qolgan changlarning <b>1/3</b> qismi qatnashdi</span>','position:absolute;left:0;right:0;top:840px;text-align:center')}
 ${E(4.4,'<span class="mono" style="font-style:normal">720 : 3 = </span><span class="cnt" data-from="720" data-to="240" data-t0="4.7" data-t1="5.9">720</span>','position:absolute;left:0;right:0;top:940px;text-align:center;font-size:62px;font-weight:800')}
 ${E(6.2,'<span style="font-size:27px;font-weight:600;color:#53605a">ta chang urug‘lantirdi</span>','position:absolute;left:0;right:0;top:1035px;text-align:center')}
`,2)})();
// S5 4-qadam: 2 spermiy
scene('s5',topbar('4-QADAM','Har bir changda 2 ta spermiy')+`
 <svg width="720" height="1280" viewBox="0 0 720 1280">
  <g class="el" data-a="0.4"><ellipse cx="360" cy="480" rx="150" ry="95" fill="#f4e3a1" stroke="#17302b" stroke-width="5"/>
   <text x="360" y="370" text-anchor="middle" font-size="26" font-weight="700">1 ta chang</text></g>
  <g class="el" data-a="1.6"><circle cx="300" cy="480" r="26" fill="#3a7bd5"/><text x="300" y="487" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">n</text></g>
  <g class="el" data-a="2.1"><circle cx="420" cy="480" r="26" fill="#3a7bd5"/><text x="420" y="487" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">n</text></g>
  <g class="el" data-a="2.7"><text x="300" y="625" text-anchor="middle" font-size="23" font-weight="700" fill="#3a7bd5">spermiy 1</text><text x="420" y="625" text-anchor="middle" font-size="23" font-weight="700" fill="#3a7bd5">spermiy 2</text></g>
  <g class="el" data-a="4"><path d="M300 650 L220 700" stroke="#17302b" stroke-width="4" fill="none"/><path d="M420 650 L500 700" stroke="#17302b" stroke-width="4" fill="none"/>
   <circle cx="200" cy="735" r="46" fill="#f8c9d4" stroke="#17302b" stroke-width="4"/><text x="200" y="830" text-anchor="middle" font-size="22" font-weight="700">tuxum hujayra</text>
   <ellipse cx="520" cy="735" rx="60" ry="42" fill="#d8ecf8" stroke="#17302b" stroke-width="4"/><text x="520" y="830" text-anchor="middle" font-size="22" font-weight="700">markaziy hujayra</text></g>
  <g class="el" data-a="5.4"><text x="360" y="905" text-anchor="middle" font-size="26" font-weight="800" fill="#e8643a">qo‘sh urug‘lanish: ikkala spermiy ham qatnashadi</text></g>
 </svg>
 ${E(7.4,'<span class="mono" style="font-style:normal">240 · 2 = </span><span class="cnt" data-from="240" data-to="480" data-t0="7.8" data-t1="9">240</span>','position:absolute;left:0;right:0;top:990px;text-align:center;font-size:66px;font-weight:800')}
 ${E(9.5,'<span style="font-size:27px;font-weight:600;color:#53605a">ta spermiy</span>','position:absolute;left:0;right:0;top:1085px;text-align:center')}
`,3);
// S6 5-qadam: xromosomalar
scene('s6',topbar('5-QADAM','Xromosomalar soni')+`
 ${E(0.5,'<div style="font-size:34px;font-weight:600;text-align:center;line-height:1.5">Spermiy — gaploid (<b>n</b>) hujayra<br>2n = 20 ⇒ <span class="hl">n = 10</span></div>','position:absolute;left:60px;right:60px;top:400px')}
 <svg width="720" height="1280" viewBox="0 0 720 1280"><g class="el" data-a="2.2">
  <circle cx="360" cy="640" r="78" fill="#3a7bd5"/>
  ${Array.from({length:10},(_,i)=>{const a=i/10*6.283;return `<rect x="${360+Math.cos(a)*40-4}" y="${640+Math.sin(a)*40-12}" width="8" height="24" rx="4" fill="#fff" transform="rotate(${i*36} ${360+Math.cos(a)*40} ${640+Math.sin(a)*40})"/>`}).join('')}
  <text x="360" y="750" text-anchor="middle" font-size="25" font-weight="700">1 ta spermiy = 10 xromosoma</text></g></svg>
 ${E(4.2,'<span class="mono" style="font-style:normal">480 · 10 = </span><span class="cnt" data-from="480" data-to="4800" data-t0="4.6" data-t1="6.4">480</span>','position:absolute;left:0;right:0;top:900px;text-align:center;font-size:66px;font-weight:800;color:#e8643a')}
 ${E(6.8,'<span style="font-size:27px;font-weight:600;color:#53605a">ta xromosoma</span>','position:absolute;left:0;right:0;top:1010px;text-align:center')}
`,4);
// S7 javoblar
scene('s7',topbar('JAVOB','Natijalar')+`
 ${E(0.5,'<small>1-qadam</small>240 · 4 = 960 ta mikrospora','top:360px','card')}
 ${E(1.4,'<small>2-qadam</small>960 · 0,75 = 720 ta chang','top:470px','card')}
 ${E(2.3,'<small>3-qadam</small>720 : 3 = 240 ta chang','top:580px','card')}
 ${E(3.2,'<small>4-qadam</small>240 · 2 = 480 ta spermiy','top:690px','card')}
 ${E(4.1,'<small>5-qadam</small>480 · 10 = 4800','top:800px;border-left-color:#e8643a','card')}
 ${E(5.4,'<div style="font-size:30px;font-weight:700;margin-bottom:8px">Javob:</div><div style="font-size:66px;font-weight:800;color:#e8643a;white-space:nowrap">4800 ta xromosoma</div>','position:absolute;left:0;right:0;top:940px;text-align:center')}
`,5);
// S8 outro
scene('s8',`${E(0.2,'<div class="logo" style="position:static;justify-content:center;font-size:42px"><i style="width:68px;height:68px"></i><div>BIOLOGIYA<small style="font-size:16px">MASALA · YECHIM</small></div></div>','position:absolute;left:0;right:0;top:470px')}
 ${E(0.9,'<div class="title" style="font-size:54px">Yechim tugadi</div>','position:absolute;left:0;right:0;top:640px;text-align:center')}
 ${E(1.5,'<div style="font-size:28px;font-weight:600;color:#53605a">Keyingi masalada ko‘rishamiz</div>','position:absolute;left:0;right:0;top:760px;text-align:center')}`);

function M(id,x){const A=MAPS[id];if(!A||!A.length)return x;
 if(x<=A[0][0])return x-A[0][0]+A[0][1];
 for(let i=0;i<A.length-1;i++){const [o0,n0]=A[i],[o1,n1]=A[i+1];if(x<=o1)return n0+(x-o0)*(n1-n0)/(o1-o0)}
 const [ol,nl]=A[A.length-1];return x-ol+nl}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-x,3);
window.render=function(t){
 for(const [id,s,e] of TL){
  const sc=document.getElementById(id);
  const inT=t>=s&&t<e;
  sc.style.display=inT?'block':'none';if(!inT)continue;
  const fi=clamp((t-s)/0.35),fo=clamp((e-t)/0.3);sc.style.opacity=Math.min(fi,fo);
  const lt=t-s;
  sc.querySelectorAll('.el').forEach(el=>{
   const a=M(id,parseFloat(el.dataset.a||0));const p=ease(clamp((lt-a)/0.55));
   el.style.opacity=p;
   if(el.tagName.toLowerCase()==='g'||el.namespaceURI===NS){el.setAttribute('transform',`translate(0 ${(1-p)*22})`)}
   else el.style.transform=`translateY(${(1-p)*22}px)`;
   if(el.classList.contains('grow')){const d=parseFloat(el.dataset.d||1);const r=ease(clamp((lt-a)/d));
     el.querySelectorAll('rect').forEach(r0=>{r0.style.transformOrigin='80px 0';r0.style.transform=`scaleX(${r})`});
     el.setAttribute('transform','');el.style.opacity=lt>=a?1:0}
   const c=el.querySelector('.cnt');if(c){const t0=M(id,parseFloat(c.dataset.t0)),t1=t0+(parseFloat(c.dataset.t1)-parseFloat(c.dataset.t0));const k=ease(clamp((lt-t0)/(t1-t0)));
     c.textContent=Math.round(parseFloat(c.dataset.from)+(parseFloat(c.dataset.to)-parseFloat(c.dataset.from))*k)}
  });
  if(id==='s4'){const k=clamp((lt-M('s4',2))/1.2);sc.querySelectorAll('.nsel').forEach(r=>{r.setAttribute('fill',k>0?`rgb(${47+(185-47)*k|0},${143+(182-143)*k|0},${91+(170-91)*k|0})`:'#2f8f5b')});
    sc.querySelectorAll('.sel').forEach(r=>{r.setAttribute('fill',k>0?`rgb(${47+(232-47)*k|0},${143+(100-143)*k|0},${91+(58-91)*k|0})`:'#2f8f5b')})}
 }
};
render(0);
</script></body></html>
